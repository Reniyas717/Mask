<!DOCTYPE html>
<html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; overflow: hidden; }
        #container {
            position: relative;
            width: 100%;
            background: #0F172A;
            border-radius: 12px;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 12px;
        }
        canvas { display: none; }
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.6);
            color: #A3E635;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .dot {
            width: 7px; height: 7px;
            background: #A3E635;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .idle {
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #475569;
            font-size: 0.92rem;
        }
        .error-msg {
            color: #FC8181;
            padding: 2rem;
            text-align: center;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 0.85rem;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="idle" class="idle">Initialising camera...</div>
        <video id="video" autoplay playsinline muted style="display:none;"></video>
        <div id="badge" class="badge" style="display:none;">
            <div class="dot"></div>
            LIVE
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const idleEl = document.getElementById('idle');
        const badgeEl = document.getElementById('badge');
        let intervalId = null;
        let frameCount = 0;

        function sendReady() {
            // Tell Streamlit the component is ready
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:componentReady",
                apiVersion: 1
            }, "*");
        }

        function setFrameHeight(h) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setFrameHeight",
                height: h
            }, "*");
        }

        function setValue(val) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: val,
                dataType: "json",
            }, "*");
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    idleEl.style.display = 'none';
                    video.style.display = 'block';
                    badgeEl.style.display = 'flex';

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    // Set iframe height to match video aspect ratio
                    const aspectRatio = video.videoHeight / video.videoWidth;
                    const containerWidth = document.getElementById('container').offsetWidth;
                    setFrameHeight(Math.round(containerWidth * aspectRatio) + 4);

                    // Capture every 700ms — gives server ~1s to run inference per frame
                    intervalId = setInterval(captureFrame, 700);
                };
            } catch (err) {
                idleEl.innerHTML = `<div class="error-msg">
                    Camera access denied or unavailable.<br>
                    Please allow camera permissions in your browser and refresh.<br>
                    <br><small>${err.message}</small>
                </div>`;
                setFrameHeight(200);
            }
        }

        function captureFrame() {
            if (video.readyState >= 2 && video.videoWidth > 0) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                frameCount++;
                setValue({ frame: dataUrl, seq: frameCount });
            }
        }

        sendReady();
        setFrameHeight(400);
        startCamera();
    </script>
</body>
</html>
