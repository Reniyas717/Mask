<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;overflow:hidden;height:0}
video,canvas{display:none}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<script>
(function(){
  var v=document.getElementById('v'),
      c=document.getElementById('c'),
      ctx=c.getContext('2d'),
      started=false;

  function stReady(){
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
  }
  function stHeight(h){
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:h},"*");
  }
  function stValue(val){
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:val,dataType:"json"},"*");
  }

  window.addEventListener("message",function(e){
    if(e.data && e.data.type==="streamlit:render"){
      if(!started){ started=true; startCam(); }
      stHeight(0);
    }
  });

  function startCam(){
    navigator.mediaDevices.getUserMedia({video:{width:{ideal:480},height:{ideal:360},facingMode:'user'}})
    .then(function(stream){
      v.srcObject=stream;
      v.onloadedmetadata=function(){
        c.width=v.videoWidth;
        c.height=v.videoHeight;
        stHeight(0);
        setInterval(grab,1500);
        setTimeout(grab,400);
      };
    }).catch(function(){
      stValue("ERROR");
    });
  }

  function grab(){
    if(v.readyState>=2 && v.videoWidth>0){
      ctx.drawImage(v,0,0,c.width,c.height);
      stValue(c.toDataURL('image/jpeg',0.55));
    }
  }

  stReady();
  stHeight(0);
})();
</script>
</body>
</html>
